<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="As melhores máquinas e ferramentas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.6" stop-color="#121212"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="yel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFD86B"/>
      <stop offset="1" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B800" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F5B800" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="80" height="80" fill="transparent"/>
      <rect width="2" height="80" fill="#F5B800" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#stripes)"/>
  <ellipse cx="1150" cy="300" rx="600" ry="280" fill="url(#glow)"/>

  <!-- raios decorativos canto superior esquerdo -->
  <g opacity="0.75">
    <polygon points="0,0 160,0 60,120 0,80" fill="#F5B800"/>
    <polygon points="0,100 110,0 10,0 0,30" fill="#111"/>
    <polygon points="0,500 120,600 0,600" fill="#F5B800" opacity="0.6"/>
  </g>

  <!-- PARAFUSADEIRA -->
  <g transform="translate(600,120)">
    <!-- corpo -->
    <path d="M60 60 L260 60 L280 100 L280 150 L260 190 L60 190 L50 150 L50 100 Z" fill="#F5B800" stroke="#000" stroke-width="3"/>
    <rect x="80" y="80" width="140" height="90" rx="6" fill="#111"/>
    <rect x="95" y="100" width="110" height="20" rx="4" fill="#2a2a2a"/>
    <!-- mandril -->
    <rect x="260" y="105" width="60" height="40" fill="url(#metal)" stroke="#000" stroke-width="2"/>
    <circle cx="340" cy="125" r="18" fill="#111" stroke="#F5B800" stroke-width="3"/>
    <!-- broca -->
    <rect x="356" y="121" width="90" height="8" fill="#ccc"/>
    <path d="M446 121 L470 125 L446 129 Z" fill="#888"/>
    <!-- pega -->
    <path d="M100 190 Q90 230 100 280 L170 280 Q180 230 170 190 Z" fill="#111" stroke="#F5B800" stroke-width="3"/>
    <!-- bateria -->
    <rect x="110" y="280" width="60" height="40" rx="6" fill="#F5B800" stroke="#000" stroke-width="2"/>
    <rect x="118" y="286" width="44" height="6" rx="2" fill="#111"/>
    <!-- gatilho -->
    <path d="M200 190 L220 190 L215 215 L205 215 Z" fill="#111"/>
  </g>

  <!-- SERRA CIRCULAR -->
  <g transform="translate(900,180)">
    <!-- disco -->
    <circle cx="140" cy="100" r="95" fill="#f0f0f0" stroke="#000" stroke-width="3"/>
    <circle cx="140" cy="100" r="80" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="6 4"/>
    <circle cx="140" cy="100" r="18" fill="#111" stroke="#F5B800" stroke-width="3"/>
    <!-- dentes -->
    <g fill="#f0f0f0" stroke="#000" stroke-width="2">
      <polygon points="140,0 148,12 132,12"/>
      <polygon points="207,33 212,47 196,43"/>
      <polygon points="235,100 220,96 220,112"/>
      <polygon points="207,167 196,157 212,153"/>
      <polygon points="140,200 132,188 148,188"/>
      <polygon points="73,167 84,153 88,167"/>
      <polygon points="45,100 60,96 60,112"/>
      <polygon points="73,33 88,33 84,47"/>
    </g>
    <!-- capa -->
    <path d="M60 110 L220 110 L240 180 L40 180 Z" fill="#F5B800" stroke="#000" stroke-width="3"/>
    <rect x="80" y="130" width="140" height="40" fill="#111"/>
    <!-- motor -->
    <rect x="230" y="60" width="90" height="100" rx="8" fill="#F5B800" stroke="#000" stroke-width="3"/>
    <rect x="245" y="75" width="60" height="70" rx="4" fill="#111"/>
    <circle cx="275" cy="110" r="15" fill="#2a2a2a" stroke="#F5B800" stroke-width="2"/>
  </g>

  <!-- MÁQUINA DE SOLDA -->
  <g transform="translate(1180,220)">
    <!-- corpo -->
    <rect x="0" y="0" width="240" height="180" rx="10" fill="#F5B800" stroke="#000" stroke-width="3"/>
    <rect x="20" y="20" width="200" height="100" rx="6" fill="#111"/>
    <!-- display -->
    <rect x="40" y="35" width="90" height="50" rx="4" fill="#0a1a0a" stroke="#F5B800"/>
    <text x="85" y="72" text-anchor="middle" font-family="Courier,monospace" font-weight="700" font-size="28" fill="#39FF14">200</text>
    <!-- botões -->
    <circle cx="160" cy="55" r="12" fill="#2a2a2a" stroke="#F5B800" stroke-width="2"/>
    <circle cx="195" cy="55" r="12" fill="#2a2a2a" stroke="#F5B800" stroke-width="2"/>
    <rect x="150" y="80" width="55" height="20" fill="#2a2a2a" rx="2"/>
    <!-- grelha -->
    <g stroke="#111" stroke-width="2">
      <line x1="30" y1="135" x2="210" y2="135"/>
      <line x1="30" y1="145" x2="210" y2="145"/>
      <line x1="30" y1="155" x2="210" y2="155"/>
    </g>
    <!-- cabo -->
    <path d="M30 180 Q0 200 10 230" stroke="#111" stroke-width="8" fill="none"/>
  </g>

  <!-- COMPRESSOR -->
  <g transform="translate(1340,310)">
    <!-- tanque -->
    <ellipse cx="90" cy="110" rx="90" ry="50" fill="#F5B800" stroke="#000" stroke-width="3"/>
    <rect x="0" y="80" width="180" height="60" fill="#F5B800"/>
    <line x1="0" y1="80" x2="180" y2="80" stroke="#000" stroke-width="3"/>
    <line x1="0" y1="140" x2="180" y2="140" stroke="#000" stroke-width="3"/>
    <ellipse cx="90" cy="80" rx="90" ry="12" fill="none" stroke="#000" stroke-width="2"/>
    <!-- motor em cima -->
    <rect x="30" y="20" width="110" height="60" rx="6" fill="#111" stroke="#000" stroke-width="2"/>
    <circle cx="85" cy="50" r="18" fill="#2a2a2a" stroke="#F5B800" stroke-width="2"/>
    <rect x="115" y="35" width="25" height="30" fill="#F5B800" rx="2"/>
    <!-- rodas -->
    <circle cx="20" cy="170" r="18" fill="#111" stroke="#F5B800" stroke-width="3"/>
    <circle cx="160" cy="170" r="18" fill="#111" stroke="#F5B800" stroke-width="3"/>
    <!-- manômetro -->
    <circle cx="60" cy="100" r="12" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <line x1="60" y1="100" x2="60" y2="92" stroke="#e53935" stroke-width="2"/>
  </g>

  <!-- bancada -->
  <rect x="580" y="430" width="1020" height="20" fill="#5c3b1e"/>
  <rect x="580" y="430" width="1020" height="5" fill="#8a5a2d"/>
  <rect x="580" y="450" width="1020" height="150" fill="#3b2612"/>

  <!-- selo de brilho inferior -->
  <ellipse cx="1050" cy="440" rx="500" ry="20" fill="#000" opacity="0.4"/>
</svg>
